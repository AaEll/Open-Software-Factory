name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual build validation (no release published)

permissions:
  contents: write # create the GitHub Release + attach artifacts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # Publish a GitHub Release only for tag pushes; workflow_dispatch just validates the build.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

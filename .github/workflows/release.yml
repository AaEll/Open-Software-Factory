name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # build + smoke without publishing

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

jobs:
  # Local artifacts: wheel + sdist -> GitHub Release, gated by the pass-through smoke.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + history so hatch-vcs derives the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: predeployment smoke test (installed wheel)
        run: |
          pip install dist/*.whl
          osf-smoke
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Cloud artifact: container -> GHCR, gated by the pass-through smoke.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-software-factory" >> "$GITHUB_OUTPUT"
      - run: docker build -t "${{ steps.img.outputs.name }}:${{ github.sha }}" .
      - name: predeployment smoke test (container)
        run: docker run --rm "${{ steps.img.outputs.name }}:${{ github.sha }}"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE="${{ steps.img.outputs.name }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:${GITHUB_REF_NAME}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:latest"

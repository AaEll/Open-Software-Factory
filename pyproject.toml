[project]
name = "open-software-factory"
description = "Autonomous multi-agent software factory: objectives in, merged PRs out."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []
dynamic = ["version"] # derived from the git tag by hatch-vcs

[project.scripts]
sf = "osf.cli:main"
sf-smoke = "osf.smoke:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",  # for the GitHubForge mock-transport tests
]
# Real GitHub forge adapter.
github = [
    "httpx>=0.27",
]
# Real agent engines. The offline eval does not need these.
agent = [
    "openai>=1.40",       # Fireworks (OpenAI-compatible) — factory default
    "anthropic>=0.40",    # optional second engine
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

# No .git in the build context (Docker) / no tags yet → fall back instead of erroring.
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["osf"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

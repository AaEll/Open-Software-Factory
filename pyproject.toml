[project]
name = "open-software-factory"
version = "0.0.0"
description = "Autonomous multi-agent software factory: objectives in, merged PRs out."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Real agent engines. The offline eval does not need these.
agent = [
    "openai>=1.40",       # Fireworks (OpenAI-compatible) — factory default
    "anthropic>=0.40",    # optional second engine
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osf"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
